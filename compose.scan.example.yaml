# Optional scanner overlay with private NAS directories mounted read-only.
# Local file compose.scan.yaml is not tracked in git.
services:
  scanner:
    build: .
    profiles: ["scanner"]
    env_file: .env
    environment:
      POSTGRES_HOST: db
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - "${MEDIA45_MOVIES_PATH:?Set MEDIA45_MOVIES_PATH in your private .env}:/media/movies:ro"
      - "${MEDIA45_SERIES_PATH:?Set MEDIA45_SERIES_PATH in your private .env}:/media/series:ro"
    networks: [internal]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    command: ["python", "manage.py", "scan_media", "--root", "all"]
