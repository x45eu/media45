name: media45
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal]
    security_opt: [no-new-privileges:true]
  web:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: db
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:8000"
    volumes:
      - coverdata:/app/coverdata
    networks: [internal]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs: [/tmp]
    command: ["gunicorn","media45.wsgi:application","--bind","0.0.0.0:8000","--workers","2"]
  worker:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: db
    depends_on:
      db:
        condition: service_healthy
    networks: [internal]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs: [/tmp]
    command: ["python", "manage.py", "send_notifications", "--loop"]
networks:
  internal:
    driver: bridge
volumes:
  pgdata:
  coverdata:
