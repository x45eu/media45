{% extends "catalog/base.html" %}
{% block content %}
<section class="account-form">
  <p class="eyebrow">KONTO</p><h1>Passwort ändern</h1>
  <p>Du benötigst dein bisheriges Passwort. Das neue Passwort muss den Sicherheitsregeln von media45 entsprechen.</p>
  <form method="post" class="card">{% csrf_token %}{{ form.as_p }}<button type="submit">Neues Passwort speichern</button></form>
  <p class="privacy-note">MFA und Passkeys sind noch nicht implementiert.</p>
</section>
{% endblock %}
